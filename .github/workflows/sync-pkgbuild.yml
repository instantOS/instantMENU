name: Sync PKGBUILD metadata
run-name: "Sync PKGBUILD: ${{ github.event.pull_request.title }}"

on:
  pull_request_target:
    types:
      - opened
      - synchronize
      - reopened

jobs:
  sync:
    if: github.event.pull_request.head.repo.full_name == github.repository && startsWith(github.head_ref, 'release/')
    runs-on: blacksmith-4vcpu-ubuntu-2404
    container:
      image: archlinux:latest
    permissions:
      contents: write
    steps:
      - name: Install dependencies
        run: |
          pacman -Syu --noconfirm
          pacman -S --noconfirm --needed base-devel git python sudo
      - name: Create builder user
        run: |
          useradd -m builder
          chown -R builder:builder /home/builder
      - name: Checkout release branch
        uses: actions/checkout@v7
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.ref }}
      - name: Configure git
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
      - name: Sync package metadata
        run: |
          set -euo pipefail
          version="$(python3 -c 'import tomllib; print(tomllib.load(open("Cargo.toml", "rb"))["package"]["version"])')"
          changed=()
          for directory in packaging/arch packaging/arch-bin; do
            pkgbuild="$directory/PKGBUILD"
            sed -i "s/^pkgver=.*/pkgver=$version/" "$pkgbuild"
            cp "$pkgbuild" /home/builder/PKGBUILD
            chown builder:builder /home/builder/PKGBUILD
            su builder -c 'cd /home/builder && makepkg --printsrcinfo' > "$directory/.SRCINFO"
            if ! git diff --quiet -- "$pkgbuild" "$directory/.SRCINFO"; then
              changed+=("$pkgbuild" "$directory/.SRCINFO")
            fi
          done
          if ((${#changed[@]})); then
            git add "${changed[@]}"
            git commit -m "chore: sync PKGBUILD metadata"
            git push
          fi
