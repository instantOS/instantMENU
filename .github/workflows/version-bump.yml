name: Version bump PR

on:
  push:
    branches:
      - main
    paths-ignore:
      - Cargo.toml
      - Cargo.lock
      - CHANGELOG.md
      - instantmenu.1
      - packaging/arch/PKGBUILD
      - packaging/arch/.SRCINFO
      - packaging/arch-bin/PKGBUILD
      - packaging/arch-bin/.SRCINFO
  schedule:
    - cron: "17 5 * * 1"
  workflow_dispatch:
    inputs:
      bump:
        description: Version bump to prepare
        required: true
        default: auto
        type: choice
        options:
          - auto
          - patch
          - minor
          - major

jobs:
  version-bump:
    name: Prepare release PR
    runs-on: blacksmith-4vcpu-ubuntu-2404
    container:
      image: archlinux:latest
    if: ${{ github.repository_owner == 'instantOS' }}
    permissions:
      contents: write
      pull-requests: write
    concurrency:
      group: version-bump-pr
      cancel-in-progress: false
    steps:
      # actions/checkout falls back to a source archive when git is absent.
      # Release planning needs full history and tags, so bootstrap git first.
      - name: Bootstrap checkout dependencies
        run: |
          pacman-key --init
          pacman-key --populate archlinux
          pacman -Syu --noconfirm
          pacman -S --noconfirm --needed git
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Install build dependencies
        run: bash scripts/ci/install-deps-arch.sh
      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          cache-bin: "false"
      - name: Remove leaked rustup state
        run: rm -rf ~/.rustup ~/.cargo/bin
      - name: Configure git
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
      - name: Prepare release changes
        env:
          BUMP: ${{ inputs.bump || 'auto' }}
        run: python3 .github/scripts/prepare-release.py --bump "$BUMP"
      - name: Generate derived release metadata
        run: |
          cargo run --locked --bin instantmenu-mangen
          useradd -m builder
          for directory in packaging/arch packaging/arch-bin; do
            install -o builder -g builder -m 0644 "$directory/PKGBUILD" /home/builder/PKGBUILD
            su builder -c 'cd /home/builder && makepkg --printsrcinfo' > "$directory/.SRCINFO"
          done
      - name: Read prepared version
        id: version
        run: bash scripts/ci/extract-version.sh
      - name: Open or update release PR
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: release/version-bump
          delete-branch: true
          commit-message: "chore: release v${{ steps.version.outputs.version }}"
          title: "chore: release v${{ steps.version.outputs.version }}"
          body: |
            Prepare `v${{ steps.version.outputs.version }}`.

            This PR updates Cargo metadata, the changelog, the generated man page, and Arch package metadata.
