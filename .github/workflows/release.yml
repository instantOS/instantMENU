name: Release
on:
  push:
    branches:
      - main
    paths:
      - Cargo.toml
      - Cargo.lock
      - CHANGELOG.md
    tags:
      - "v*"
  workflow_dispatch:
jobs:
  metadata:
    name: Prepare release metadata
    runs-on: ubuntu-26.04
    container:
      image: ubuntu:26.04
    if: ${{ github.repository_owner == 'instantOS' }}
    permissions:
      contents: write
    outputs:
      should_release: ${{ steps.metadata.outputs.should_release }}
      tag: ${{ steps.metadata.outputs.tag }}
      version: ${{ steps.metadata.outputs.version }}
    steps:
      - name: Install dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends ca-certificates git
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Configure git
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
      - name: Determine release tag
        id: metadata
        run: bash scripts/ci/determine-release.sh
  build:
    name: Build release artifacts
    runs-on: ubuntu-26.04
    container:
      image: archlinux:latest
    needs: metadata
    if: ${{ needs.metadata.outputs.should_release == 'true' }}
    env:
      CARGO_TERM_COLOR: always
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Setup Arch container
        uses: ./.github/actions/setup-arch
      - name: Rust cache
        uses: Swatinem/rust-cache@v2
      - name: Create build user
        run: |
          useradd -m builder
          chown -R builder:builder "$PWD"
      - name: Determine target triple
        id: target
        run: echo "triple=$(rustc -vV | awk '/^host:/ {print $2}')" >> "$GITHUB_OUTPUT"
      - name: Extract version
        id: vars
        run: bash scripts/ci/extract-version.sh "$GITHUB_REF_NAME"
      # No cargo test here: ci.yml already runs the test suite for every
      # commit on main/PRs, so the release path only builds (same trade-off
      # as instantCLI's and instantWM's release pipelines).
      - name: Build release binaries
        run: |
          workspace="$PWD"
          su builder -c "cd '$workspace' && cargo build --release --locked --bin instantmenu --bin itest"
      - name: Strip binaries
        run: strip target/release/instantmenu target/release/itest
      - name: Collect artifacts
        run: bash scripts/ci/package-binary.sh "${{ steps.target.outputs.triple }}" "${{ steps.vars.outputs.version }}" target/release
      - name: Upload release archive
        uses: actions/upload-artifact@v7
        with:
          name: instantmenu-${{ steps.vars.outputs.version }}-${{ steps.target.outputs.triple }}
          path: |
            artifacts/*.tgz
            artifacts/*.sha256
  cross-compile:
    # GNU ARM cross builds use Ubuntu sysroots. The apk job builds musl
    # natively on Alpine with its system libxkbcommon(-x11) libraries.
    name: Cross-compile ${{ matrix.target }}
    runs-on: ubuntu-26.04
    # Container jobs run steps with `sh -e {0}`, which is dash on Ubuntu and
    # does not support `pipefail` (or other bashisms).
    defaults:
      run:
        shell: bash
    container:
      image: ubuntu:26.04
    needs: metadata
    if: ${{ needs.metadata.outputs.should_release == 'true' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            target: aarch64-unknown-linux-gnu
            linker: aarch64-linux-gnu-gcc
            artifact: aarch64-unknown-linux-gnu
          - arch: armhf
            target: armv7-unknown-linux-gnueabihf
            linker: arm-linux-gnueabihf-gcc
            artifact: armv7-unknown-linux-gnueabihf
    env:
      CARGO_TERM_COLOR: always
      DEBIAN_FRONTEND: noninteractive
      CARGO_HOME: /opt/cargo
      RUSTUP_HOME: /opt/rustup
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Install build dependencies
        # Installs the cross toolchain and :arm64/:armhf dev libs for this
        # matrix leg only (see scripts/ci/install-deps-ubuntu.sh).
        run: bash scripts/ci/install-deps-ubuntu.sh --cross ${{ matrix.arch }}
      - name: Install Rust toolchain
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y
          echo "$CARGO_HOME/bin" >> "$GITHUB_PATH"
      - name: Add Rust cross-compilation target
        run: rustup target add ${{ matrix.target }}
      - name: Extract version
        id: vars
        run: bash scripts/ci/extract-version.sh "$GITHUB_REF_NAME"
      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: cross-deps
          key: cross-${{ matrix.target }}
      - name: Cross compile
        env:
          LINKER: ${{ matrix.linker }}
        run: |
          set -euo pipefail
          target="${{ matrix.target }}"
          triple="${LINKER%-gcc}"
          # Derive cargo's per-target env vars from the triple, e.g.
          # CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER and
          # PKG_CONFIG_aarch64_unknown_linux_gnu.
          target_env="$(printf '%s' "$target" | tr -- '-a-z' '_A-Z')"
          export "CARGO_TARGET_${target_env}_LINKER=${LINKER}"
          export "PKG_CONFIG_${target//-/_}=${triple}-pkg-config"
          cargo build --locked --release --bin instantmenu --bin itest --target "$target"
      - name: Strip binaries
        env:
          LINKER: ${{ matrix.linker }}
        run: |
          strip="${LINKER%-gcc}-strip"
          "$strip" "target/${{ matrix.target }}/release/instantmenu" "target/${{ matrix.target }}/release/itest"
      - name: Collect artifact
        run: bash scripts/ci/package-binary.sh "${{ matrix.target }}" "${{ steps.vars.outputs.version }}" "target/${{ matrix.target }}/release"
      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: instantmenu-${{ steps.vars.outputs.version }}-${{ matrix.artifact }}
          path: |
            artifacts/instantmenu-${{ matrix.target }}-v${{ steps.vars.outputs.version }}.tgz
            artifacts/instantmenu-${{ matrix.target }}-v${{ steps.vars.outputs.version }}.tgz.sha256
  pkgbuild:
    name: Build Arch package
    runs-on: ubuntu-26.04
    container:
      image: archlinux:latest
    needs:
      - metadata
      - build
    if: ${{ needs.metadata.outputs.should_release == 'true' }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Arch container
        uses: ./.github/actions/setup-arch
        with:
          packages: base-devel pacman-contrib
          include-test-base: 'false'
      - name: Download native archive
        uses: actions/download-artifact@v8
        with:
          name: instantmenu-${{ needs.metadata.outputs.version }}-x86_64-unknown-linux-gnu
          path: arch-build
      - name: Build package
        env:
          VERSION: ${{ needs.metadata.outputs.version }}
        run: |
          cp packaging/arch-bin/PKGBUILD arch-build/
          useradd -m builder
          chown -R builder:builder arch-build
          cd arch-build
          if ! grep -Fxq "pkgver=$VERSION" PKGBUILD; then
            sed -i "s/^pkgver=.*/pkgver=$VERSION/; s/^pkgrel=.*/pkgrel=1/" PKGBUILD
          fi
          runuser -u builder -- updpkgsums
          runuser -u builder -- makepkg --nodeps --noconfirm
      - name: Collect package artifacts
        run: |
          mkdir -p artifacts
          mv arch-build/*.pkg.tar.zst artifacts/
      - name: Upload Arch package
        uses: actions/upload-artifact@v7
        with:
          name: instantmenu-${{ needs.metadata.outputs.version }}-arch-package
          path: artifacts/
  deb:
    name: Build Debian package
    runs-on: ubuntu-26.04
    container:
      image: ubuntu:26.04
    needs:
      - metadata
      - build
    if: ${{ needs.metadata.outputs.should_release == 'true' }}
    steps:
      - name: Install packaging tools
        run: |
          apt-get update
          apt-get install -y --no-install-recommends ca-certificates dpkg-dev
      - name: Checkout
        uses: actions/checkout@v7
      - name: Extract version
        id: vars
        run: bash scripts/ci/extract-version.sh "$GITHUB_REF_NAME"
      - name: Download native archive
        uses: actions/download-artifact@v8
        with:
          name: instantmenu-${{ steps.vars.outputs.version }}-x86_64-unknown-linux-gnu
          path: dist
      - name: Extract binaries
        env:
          VERSION: ${{ steps.vars.outputs.version }}
        run: |
          tar -xzf "dist/instantmenu-x86_64-unknown-linux-gnu-v${VERSION}.tgz" -C dist
          archive="dist/instantmenu-x86_64-unknown-linux-gnu-v${VERSION}"
          install -Dm0755 "$archive/instantmenu" target/release/instantmenu
          install -Dm0755 "$archive/itest" target/release/itest
      - name: Build Debian package
        run: bash utils/build_deb.sh
      - name: Collect Debian package
        env:
          VERSION: ${{ steps.vars.outputs.version }}
        run: |
          mkdir -p artifacts
          mv "target/deb/instantmenu_${VERSION}_amd64.deb" artifacts/
          cd artifacts
          sha256sum "instantmenu_${VERSION}_amd64.deb" > "instantmenu_${VERSION}_amd64.deb.sha256"
      - name: Upload Debian package
        uses: actions/upload-artifact@v7
        with:
          name: instantmenu-${{ steps.vars.outputs.version }}-deb
          path: artifacts/
  apk:
    name: Build Alpine package (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 360
    needs: metadata
    if: ${{ needs.metadata.outputs.should_release == 'true' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
          - arch: aarch64
            runner: ubuntu-24.04-arm
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Cache Alpine Cargo dependencies and build output
        uses: actions/cache@v4
        with:
          path: |
            target/apk-cargo
            target/apk-build
          key: alpine-3.24-${{ matrix.arch }}-${{ hashFiles('Cargo.lock', 'packaging/alpine/APKBUILD.in') }}
          restore-keys: alpine-3.24-${{ matrix.arch }}-
      - name: Build native Alpine package
        env:
          EXPECTED_ARCH: ${{ matrix.arch }}
        run: |
          docker run --rm -v "$PWD:/work" -w /work -e EXPECTED_ARCH \
            -e CARGO_HOME=/work/target/apk-cargo \
            -e APK_CARGO_TARGET_DIR=/work/target/apk-build \
            -e CARGO_BUILD_JOBS=2 alpine:3.24 sh -ec '
              test "$(apk --print-arch)" = "$EXPECTED_ARCH"
              apk add --update-cache abuild
              SUDO= abuild-keygen -a -n -i
              ./utils/build_apk.sh
            '
      - name: Smoke test Alpine installation
        run: |
          docker run --rm -v "$PWD/target/apk:/packages:ro" alpine:3.24 sh -ec '
            cd /packages
            sha256sum -c ./*.apk.sha256
            apk add --no-cache --allow-untrusted ./*.apk
            instantmenu --version
            instantmenu --help > /dev/null
            itest -f /usr/bin/instantmenu
            test -x /usr/bin/instantmenu_path
            test -f /usr/share/man/man1/instantmenu.1.gz
          '
      - name: Upload Alpine package
        uses: actions/upload-artifact@v7
        with:
          name: instantmenu-${{ needs.metadata.outputs.version }}-apk-${{ matrix.arch }}
          path: |
            target/apk/*.apk
            target/apk/*.apk.sha256
  release:
    name: Publish GitHub release
    runs-on: ubuntu-26.04
    container:
      image: ubuntu:26.04
    needs:
      - metadata
      - build
      - cross-compile
      - pkgbuild
      - deb
      - apk
    if: ${{ needs.metadata.outputs.should_release == 'true' }}
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: Extract release notes
        run: bash scripts/ci/extract-release-notes.sh "${{ needs.metadata.outputs.version }}" > release-notes.md
      - name: Publish release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.metadata.outputs.tag }}
          name: ${{ needs.metadata.outputs.tag }}
          body_path: release-notes.md
          files: dist/**/*
          # The AUR pins the published archive checksum across reruns.
          overwrite_files: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  aur-recipes:
    name: Prepare AUR recipes
    runs-on: ubuntu-26.04
    container:
      image: archlinux:latest
    needs: [metadata, release]
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout release commit
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Setup Arch container
        uses: ./.github/actions/setup-arch
        with:
          include-test-base: 'false'
          packages: base-devel pacman-contrib
      - name: Generate versioned recipes
        env:
          VERSION: ${{ needs.metadata.outputs.version }}
        run: |
          useradd -m builder
          chown -R builder:builder packaging/arch packaging/arch-bin
          for directory in packaging/arch packaging/arch-bin; do
            package=instantmenu${directory#packaging/arch}
            (
              cd "$directory"
              if ! grep -Fxq "pkgver=$VERSION" PKGBUILD; then
                sed -i "s/^pkgver=.*/pkgver=$VERSION/; s/^pkgrel=.*/pkgrel=1/" PKGBUILD
              fi
              runuser -u builder -- updpkgsums
              runuser -u builder -- makepkg --printsrcinfo > .SRCINFO
            )
            install -Dm644 "$directory/PKGBUILD" "aur-recipes/$package/PKGBUILD"
            install -Dm644 "$directory/.SRCINFO" "aur-recipes/$package/.SRCINFO"
          done
      - name: Smoke test instantmenu-bin installation
        run: |
          cd packaging/arch-bin
          runuser -u builder -- makepkg --nodeps --noconfirm
          pacman -U --noconfirm ./*.pkg.tar.zst
          instantmenu --version
          instantmenu --help > /dev/null
          itest -f /usr/bin/instantmenu
          test -x /usr/bin/instantmenu_path
          test -x /usr/bin/instantmenu_run
          # The Arch container skips extracting man pages during installation.
          pacman -Ql instantmenu-bin | grep -E ' /usr/share/man/man1/instantmenu\.1(\.gz)?$'
      - name: Upload AUR recipes
        uses: actions/upload-artifact@v7
        with:
          name: aur-recipes
          path: aur-recipes/
          include-hidden-files: true
          if-no-files-found: error
  aur:
    name: Publish to the AUR
    runs-on: ubuntu-26.04
    container:
      image: archlinux:latest
    needs: aur-recipes
    permissions:
      contents: read
    if: |-
      github.repository == 'instantOS/instantMENU' &&
      (github.ref == 'refs/heads/main' || (github.ref_type == 'tag' && github.ref_protected))
    concurrency:
      group: aur-publish
      cancel-in-progress: false
    steps:
      - name: Check for AUR SSH key
        id: aur-key
        env:
          KEY_CONFIGURED: ${{ secrets.AUR_SSH_PRIVATE_KEY != '' }}
        run: |
          echo "configured=$KEY_CONFIGURED" >> "$GITHUB_OUTPUT"
          if [ "$KEY_CONFIGURED" != true ]; then
            echo 'AUR_SSH_PRIVATE_KEY is unset. Skipping AUR publishing.'
          fi
      - name: Install publishing tools
        if: steps.aur-key.outputs.configured == 'true'
        run: |
          pacman-key --init
          pacman-key --populate archlinux
          pacman -Syu --noconfirm --needed git openssh
      - name: Checkout release commit
        if: steps.aur-key.outputs.configured == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Download AUR recipes
        if: steps.aur-key.outputs.configured == 'true'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: aur-recipes
          path: aur-recipes
      - name: Push recipes to the AUR
        if: steps.aur-key.outputs.configured == 'true'
        env:
          AUR_SSH_PRIVATE_KEY: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
        run: bash scripts/ci/publish-aur.sh aur-recipes
