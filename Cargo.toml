[package]
name = "instantmenu"
version = "4.10.0"
edition = "2021"
description = "A dynamic menu for X11 and Wayland - Rust port of instantMENU (dmenu fork)"
license = "MIT"
authors = ["instantOS contributors"]
publish = false

[[bin]]
name = "instantmenu"
path = "src/main.rs"

[[bin]]
name = "itest"
path = "src/bin/itest.rs"

[dependencies]
clap = { version = "4.6", features = ["derive"] }
clap_mangen = "0.3"
libc = "0.2"
serde = { version = "1", features = ["derive"] }
toml = "0.9"

# X11 backend (allow-unsafe-code enables xcb_ffi::XCBConnection, needed for
# AsRawXcbConnection → xkbcommon-x11)
x11rb = { version = "0.13", features = ["xinerama", "allow-unsafe-code"] }

# Wayland backend
wayland-client = "0.31"
wayland-protocols = { version = "0.32", features = ["client", "unstable"] }
wayland-protocols-wlr = { version = "0.3", features = ["client"] }

# Keyboard state (both backends), links against system libxkbcommon[-x11]
xkbcommon = { version = "0.9", features = ["x11", "wayland"] }

# Fuzzy matching (safe_read disables the page-boundary over-read optimization)
frizbee = { version = "0.13", features = ["safe_read"] }

# Shared text rendering (both backends)
csscolorparser = "0.7"
cosmic-text = "0.19"
fontdb = "0.23"
ttf-parser = "0.25"

[profile.release]
opt-level = 3
lto = true
strip = true
